name: Canary

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: canary
  cancel-in-progress: false

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@014df23b1329b615816a38eb5f473bb9000700b1 # v3

      - id: auth
        uses: google-github-actions/auth@71f986410dfbc7added4569d411d040a91dc6935 # v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CLOUDRUN_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@77e7a554d41e2ee56fc945c52dfd3f33d12def9a # v2

      - name: Run smoke canary against prod
        run: |
          set -euo pipefail
          PROD_URL=$(doppler secrets get PROD_BASE_URL --plain --project trading-portfolio --config prd)
          AUTH_TOKEN=$(curl -sS --fail-with-body -X POST \
            "https://iamcredentials.googleapis.com/v1/projects/-/serviceAccounts/${{ vars.GCP_CLOUDRUN_DEPLOYER_SA }}:generateIdToken" \
            -H "Authorization: Bearer $(gcloud auth print-access-token)" \
            -H 'Content-Type: application/json' \
            -d "{\"audience\":\"$PROD_URL\",\"includeEmail\":true}" | jq -r .token)
          echo "::add-mask::$AUTH_TOKEN"
          REQUIRE_DATA=$(doppler secrets get SMOKE_REQUIRE_DATA --plain --project trading-portfolio --config prd 2>/dev/null || echo false)
          export AUTH_TOKEN REQUIRE_DATA
          ./scripts/smoke.sh "$PROD_URL"

      - name: Notify Slack on failure
        if: failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          SLACK_WEBHOOK=$(doppler secrets get SLACK_ALERT_WEBHOOK_URL --plain --project trading-portfolio --config prd)
          [ -z "$SLACK_WEBHOOK" ] && exit 0
          PAYLOAD=$(jq -n \
            --arg run_url "$RUN_URL" \
            '{
              text: "*[FAILED] Portfolio Canary* — prod smoke checks failing",
              attachments: [{
                color: "#ff0000",
                blocks: [
                  {type:"section", text:{type:"mrkdwn", text:"*[FAILED] Portfolio Canary*\nProd smoke checks are failing."}},
                  {type:"section", fields:[
                    {type:"mrkdwn", text:("*Run:*\n<"+$run_url+"|workflow>")}
                  ]}
                ]
              }]
            }')
          curl -sS --fail-with-body -X POST -H 'Content-Type: application/json' \
            --data "$PAYLOAD" "$SLACK_WEBHOOK" || true
