name: Portfolio Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  GCP_REGION: us-east4
  SERVICE: trading-portfolio-prd-us

jobs:
  notify_start:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    continue-on-error: true
    env:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@014df23b1329b615816a38eb5f473bb9000700b1 # v3

      - name: Notify Slack — deploy started
        env:
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          SLACK_WEBHOOK=$(doppler secrets get SLACK_DEPLOY_WEBHOOK_URL --plain --project trading-portfolio --config prd)
          [ -z "$SLACK_WEBHOOK" ] && exit 0
          SHA=$(git rev-parse HEAD)
          COMMIT_MSG=$(git log -1 --format=%s HEAD 2>/dev/null | cut -c1-140 || echo "")
          PAYLOAD=$(jq -n \
            --arg marker "[STARTED] Portfolio Deploy" \
            --arg tiers "cloud-run/api" \
            --arg short_sha "${SHA:0:7}" --arg commit_msg "$COMMIT_MSG" \
            --arg actor "$ACTOR" --arg run_url "$RUN_URL" --arg run_id "$RUN_ID" \
            '{
              text: ("*" + $marker + "* — tiers: `" + $tiers + "`"),
              attachments: [{
                color: "#36a64f",
                blocks: [
                  {type:"section", text:{type:"mrkdwn", text:("*" + $marker + "*")}},
                  {type:"section", fields:[
                    {type:"mrkdwn",text:("*Tiers:*\n`"+$tiers+"`")},
                    {type:"mrkdwn",text:("*Commit:*\n`"+$short_sha+"` — "+$commit_msg)},
                    {type:"mrkdwn",text:("*Triggered by:*\n"+$actor)},
                    {type:"mrkdwn",text:("*Run:*\n<"+$run_url+"|workflow #"+$run_id+">")}
                  ]}
                ]
              }]
            }')
          curl -sS --fail-with-body -X POST -H 'Content-Type: application/json' \
            --data "$PAYLOAD" "$SLACK_WEBHOOK" || true

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - id: sha
        run: echo "value=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - id: auth
        uses: google-github-actions/auth@71f986410dfbc7added4569d411d040a91dc6935 # v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CLOUDRUN_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@77e7a554d41e2ee56fc945c52dfd3f33d12def9a # v2

      - name: Configure docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push image
        id: build
        env:
          IMAGE: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT }}/trading-portfolio-prd/api:${{ steps.sha.outputs.value }}
        run: |
          set -euo pipefail
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@014df23b1329b615816a38eb5f473bb9000700b1 # v3

      - name: Run DB migrations
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/cloud-sql-proxy https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.14.2/cloud-sql-proxy.linux.amd64
          chmod +x /tmp/cloud-sql-proxy
          sudo mkdir -p /cloudsql && sudo chown "$USER" /cloudsql
          CONN=$(gcloud sql instances describe trading-portfolio-prd --project=${{ vars.GCP_PROJECT }} --format='value(connectionName)')
          /tmp/cloud-sql-proxy --unix-socket /cloudsql "$CONN" &
          PROXY_PID=$!
          sleep 3
          DATABASE_URL=$(doppler secrets get DATABASE_URL --plain --project trading-portfolio --config prd)
          echo "::add-mask::$DATABASE_URL"
          DATABASE_URL="$DATABASE_URL" ./db/apply.sh
          kill "$PROXY_PID"

      - name: Deploy Cloud Run revision (prd)
        env:
          IMAGE: ${{ steps.build.outputs.image }}
        run: |
          set -euo pipefail
          SECRET_REFS=""
          sep=""
          for key in HELIUS_API_KEY BIRDEYE_API_KEY TRITON_API_URL DATABASE_URL; do
            value=$(doppler secrets get "$key" --plain --project trading-portfolio --config prd)
            if [ -z "$value" ]; then
              echo "$key: empty in Doppler, skipped"
              continue
            fi
            echo "::add-mask::$value"
            slug=$(echo "$key" | tr '[:upper:]_' '[:lower:]-')
            secret="trading-portfolio-${slug}-prd"
            current=$(gcloud secrets versions access latest --secret="$secret" --project=${{ vars.GCP_PROJECT }} 2>/dev/null || true)
            if [ "$current" != "$value" ]; then
              printf '%s' "$value" | gcloud secrets versions add "$secret" --project=${{ vars.GCP_PROJECT }} --data-file=-
              echo "$secret: new version added"
            fi
            SECRET_REFS+="${sep}${key}=${secret}:latest"
            sep=","
          done
          gcloud run deploy ${{ env.SERVICE }} \
            --image="$IMAGE" \
            --region=${{ env.GCP_REGION }} \
            --project=${{ vars.GCP_PROJECT }} \
            --set-secrets="$SECRET_REFS" \
            --quiet

      - name: Prod smoke gate
        run: |
          set -euo pipefail
          URL=$(gcloud run services describe ${{ env.SERVICE }} --region=${{ env.GCP_REGION }} --project=${{ vars.GCP_PROJECT }} --format='value(status.url)')
          REQUIRE_DATA=$(doppler secrets get SMOKE_REQUIRE_DATA --plain --project trading-portfolio --config prd 2>/dev/null || echo false)
          export REQUIRE_DATA
          ./scripts/smoke.sh "$URL"

  notify_end:
    needs: [deploy]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@014df23b1329b615816a38eb5f473bb9000700b1 # v3

      - name: Notify Slack — deploy finished
        env:
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          SLACK_WEBHOOK=$(doppler secrets get SLACK_DEPLOY_WEBHOOK_URL --plain --project trading-portfolio --config prd)
          [ -z "$SLACK_WEBHOOK" ] && exit 0
          if [ "$DEPLOY_RESULT" = "success" ]; then
            STATUS=SUCCESS
            COLOR='#36a64f'
          else
            STATUS=FAILED
            COLOR='#ff0000'
          fi
          SHA=$(git rev-parse HEAD)
          COMMIT_MSG=$(git log -1 --format=%s HEAD 2>/dev/null | cut -c1-140 || echo "")
          PAYLOAD=$(jq -n \
            --arg marker "[$STATUS] Portfolio Deploy" \
            --arg tiers "cloud-run/api" \
            --arg color "$COLOR" \
            --arg short_sha "${SHA:0:7}" --arg commit_msg "$COMMIT_MSG" \
            --arg actor "$ACTOR" --arg run_url "$RUN_URL" --arg run_id "$RUN_ID" \
            --arg result "$DEPLOY_RESULT" \
            '{
              text: ("*" + $marker + "* — tiers: `" + $tiers + "`"),
              attachments: [{
                color: $color,
                blocks: [
                  {type:"section", text:{type:"mrkdwn", text:("*" + $marker + "*")}},
                  {type:"section", fields:[
                    {type:"mrkdwn",text:("*Tiers:*\n`"+$tiers+"`")},
                    {type:"mrkdwn",text:("*Result:*\n`cloud-run/api: "+$result+"`")},
                    {type:"mrkdwn",text:("*Commit:*\n`"+$short_sha+"` — "+$commit_msg)},
                    {type:"mrkdwn",text:("*Triggered by:*\n"+$actor)},
                    {type:"mrkdwn",text:("*Run:*\n<"+$run_url+"|workflow #"+$run_id+">")}
                  ]}
                ]
              }]
            }')
          curl -sS --fail-with-body -X POST -H 'Content-Type: application/json' \
            --data "$PAYLOAD" "$SLACK_WEBHOOK" || true
